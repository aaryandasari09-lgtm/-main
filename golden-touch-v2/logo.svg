<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Top arc R=76: top reaches y=24 -->
    <path id="ta" d="M 24,100 A 76,76 0 0,1 176,100"/>
    <!-- Bottom arc R=70: bottom reaches y=170 -->
    <path id="ba" d="M 30,100 A 70,70 0 0,0 170,100"/>
    <!-- Clip for left barber pole -->
    <clipPath id="lp"><rect x="22" y="65" width="14" height="84" rx="7"/></clipPath>
    <!-- Clip for right barber pole -->
    <clipPath id="rp"><rect x="164" y="65" width="14" height="84" rx="7"/></clipPath>
  </defs>

  <!-- ── Background ──────────────────────────────────── -->
  <circle cx="100" cy="100" r="99.5" fill="#090806"/>

  <!-- ── Gold rings ──────────────────────────────────── -->
  <circle cx="100" cy="100" r="97.5" fill="none" stroke="#c9a84c" stroke-width="3"/>
  <circle cx="100" cy="100" r="89"   fill="none" stroke="#c9a84c" stroke-width="1.2"/>

  <!-- ── Diamond accent dots on outer ring ─────────────── -->
  <polygon points="100,4  103,8  100,12  97,8"  fill="#c9a84c"/>
  <polygon points="100,188 103,192 100,196 97,192" fill="#c9a84c"/>
  <polygon points="4,100  8,97  12,100  8,103"  fill="#c9a84c"/>
  <polygon points="188,100 192,97 196,100 192,103" fill="#c9a84c"/>

  <!-- ── Open Scissors (top center) ──────────────────── -->
  <g transform="translate(100,23)" fill="none" stroke="#c9a84c" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left blade -->
    <path d="M 0,3 L -10,-9" stroke-width="3.2"/>
    <path d="M 0,3 L -6,10" stroke-width="2.6"/>
    <circle cx="-10" cy="12.5" r="5.5" stroke-width="2.2"/>
    <!-- Right blade -->
    <path d="M 0,3 L 10,-9"  stroke-width="3.2"/>
    <path d="M 0,3 L 6,10"   stroke-width="2.6"/>
    <circle cx="10"  cy="12.5" r="5.5" stroke-width="2.2"/>
    <!-- Pivot -->
    <circle cx="0" cy="3" r="2.5" fill="#c9a84c" stroke="none"/>
  </g>

  <!-- ── BARBER SHOP · (top arc text) ────────────────── -->
  <text fill="#c9a84c" font-size="12" font-family="Georgia,'Times New Roman',serif" font-weight="bold" letter-spacing="2.2">
    <textPath href="#ta" startOffset="50%" text-anchor="middle">BARBER SHOP ·</textPath>
  </text>

  <!-- ── Top horizontal rule ────────────────────────── -->
  <line x1="47" y1="66" x2="153" y2="66" stroke="#c9a84c" stroke-width="1.3"/>

  <!-- ── Barber pole LEFT ────────────────────────────── -->
  <rect x="22" y="65" width="14" height="84" rx="7" fill="#090806" stroke="#c9a84c" stroke-width="1.5"/>
  <g clip-path="url(#lp)" stroke="#c9a84c" stroke-width="4.5">
    <line x1="21" y1="73"  x2="37" y2="65"/>
    <line x1="21" y1="90"  x2="37" y2="82"/>
    <line x1="21" y1="107" x2="37" y2="99"/>
    <line x1="21" y1="124" x2="37" y2="116"/>
    <line x1="21" y1="141" x2="37" y2="133"/>
  </g>
  <ellipse cx="29" cy="65"  rx="7"   ry="4.5" fill="#c9a84c"/>
  <ellipse cx="29" cy="149" rx="7"   ry="4.5" fill="#c9a84c"/>

  <!-- ── Barber pole RIGHT ───────────────────────────── -->
  <rect x="164" y="65" width="14" height="84" rx="7" fill="#090806" stroke="#c9a84c" stroke-width="1.5"/>
  <g clip-path="url(#rp)" stroke="#c9a84c" stroke-width="4.5">
    <line x1="163" y1="73"  x2="179" y2="65"/>
    <line x1="163" y1="90"  x2="179" y2="82"/>
    <line x1="163" y1="107" x2="179" y2="99"/>
    <line x1="163" y1="124" x2="179" y2="116"/>
    <line x1="163" y1="141" x2="179" y2="133"/>
  </g>
  <ellipse cx="171" cy="65"  rx="7"   ry="4.5" fill="#c9a84c"/>
  <ellipse cx="171" cy="149" rx="7"   ry="4.5" fill="#c9a84c"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ── FACE PORTRAIT ──────────────────────────────── -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Hair / pompadour quiff (gold) -->
  <path d="M 71,97
           Q 69,79  74,69
           Q 81,58  91,54
           Q 100,51 109,54
           Q 119,58 126,69
           Q 131,79 129,97
           Q 121,83 114,77
           Q 107,73 100,72
           Q  93,73  86,77
           Q  79,83  71,97 Z"
        fill="#c9a84c"/>

  <!-- Sideburn left -->
  <path d="M 71,97 Q 68,108 70,115 Q 73,109 76,102 Z" fill="#c9a84c"/>
  <!-- Sideburn right -->
  <path d="M 129,97 Q 132,108 130,115 Q 127,109 124,102 Z" fill="#c9a84c"/>

  <!-- Face oval -->
  <ellipse cx="100" cy="107" rx="27" ry="30" fill="#c9a84c"/>

  <!-- Eyebrows -->
  <path d="M 80,91 Q 86,86 94,88"   stroke="#0a0806" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M 106,88 Q 114,86 120,91" stroke="#0a0806" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="88"  cy="99" rx="5.5" ry="3.8" fill="#0a0806"/>
  <ellipse cx="112" cy="99" rx="5.5" ry="3.8" fill="#0a0806"/>

  <!-- Nose (bridge + nostrils) -->
  <path d="M 97,105 Q 96,114 100,116 Q 104,114 103,105"
        stroke="#0a0806" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Mustache -->
  <path d="M 82,118 Q 91,112 100,114 Q 109,112 118,118
           Q 109,122 100,121 Q  91,122  82,118 Z"
        fill="#0a0806"/>

  <!-- Full beard -->
  <path d="M 73,120
           Q 70,132  72,141
           Q 77,150  87,154
           Q 93,157 100,157
           Q 107,157 113,154
           Q 123,150 128,141
           Q 130,132 127,120
           Q 115,126 100,127
           Q  85,126  73,120 Z"
        fill="#0a0806"/>

  <!-- ── Bottom horizontal rule ─────────────────────── -->
  <line x1="47" y1="150" x2="153" y2="150" stroke="#c9a84c" stroke-width="1.3"/>

  <!-- ── GOLDEN TOUCH (bottom arc text) ──────────────── -->
  <text fill="#c9a84c" font-size="11.5" font-family="Georgia,'Times New Roman',serif" font-weight="bold" letter-spacing="1.8">
    <textPath href="#ba" startOffset="50%" text-anchor="middle">GOLDEN TOUCH</textPath>
  </text>
</svg>
